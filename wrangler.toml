name = "alif-labs"
main = "worker/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Set to the exact production URL. For local dev, add http://localhost:5173 if needed.
# Update ALLOWED_ORIGIN to actual ALIF LABS domain before production deployment
ALLOWED_ORIGIN = "http://localhost:5173"
